      required: [productId, name, qty, price]

    Sale:
      type: object
      properties:
        id:
          type: number
        receiptNumber:
          type: string
        total:
          type: number
        method:
          type: string
          enum: [Cash, M-PESA, Credit]
        onCredit:
          type: boolean
        customerId:
          type: ["number", "null"]
        customerName:
          type: ["string", "null"]
        mpesaRef:
          type: ["string", "null"]
        mpesaReceipt:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        createdAt:
          type: string
      required: [id, receiptNumber, total, method, onCredit, items, createdAt]

    SaleInput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        total:
          type: number
        method:
          type: string
          enum: [Cash, M-PESA, Credit]
        onCredit:
          type: boolean
        customerId:
          type: ["number", "null"]
        customerName:
          type: ["string", "null"]
        mpesaRef:
          type: ["string", "null"]
        mpesaReceipt:
          type: ["string", "null"]
      required: [items, total, method]

    SalesStats:
      type: object
      properties:
