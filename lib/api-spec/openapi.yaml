          type: ["string", "null"]
        mpesaReceipt:
          type: ["string", "null"]
        failureReason:
          type: ["string", "null"]
        createdAt:
          type: string
        confirmedAt:
          type: ["string", "null"]
      required: [id, phone, amount, status, createdAt]

    MpesaSummary:
      type: object
      properties:
