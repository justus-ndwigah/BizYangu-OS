        monthProfit:
          type: number
        totalOutstandingDebt:
          type: number
        lowStockCount:
          type: number
      required: [todayRevenue, todayProfit, todaySalesCount, monthRevenue, monthProfit, totalOutstandingDebt, lowStockCount]

    # ── CUSTOMER ──────────────────────────────────────────────────────────────
    Customer:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        phone:
          type: ["string", "null"]
        totalDebt:
          type: number
        createdAt:
          type: string
      required: [id, name, totalDebt, createdAt]

    CustomerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
      required: [name]

    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string

    # ── DEBT ──────────────────────────────────────────────────────────────
    Debt:
      type: object
      properties:
        id:
          type: number
        customerId:
          type: number
        customerName:
          type: string
        amount:
          type: number
        note:
          type: ["string", "null"]
        settled:
          type: boolean
        settledAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, customerId, customerName, amount, settled, createdAt]

    DebtInput:
      type: object
      properties:
        amount:
          type: number
        note:
          type: string
      required: [amount]

    DebtsSummary:
      type: object
      properties:
